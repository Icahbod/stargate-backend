  "components": {
    "securitySchemes": {
      "bearer": {
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "type": "http"
      }
    },
    "schemas": {
      "CheckResult": {
        "type": "object",
        "properties": {
          "status": { "type": "string", "enum": ["up", "down", "not_configured"] },
          "latencyMs": { "type": "integer", "format": "int64" },
          "detail": { "type": "string" }
        },
        "required": ["status", "latencyMs"]
      },
      "Checks": {
        "type": "object",
        "additionalProperties": { "$ref": "#/components/schemas/CheckResult" }
      },
      "HealthResponse": {
        "type": "object",
        "properties": {
          "status": { "type": "string", "enum": ["ok", "degraded"] },
          "version": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "checks": { "$ref": "#/components/schemas/Checks" }
        },
        "required": ["status", "version", "timestamp", "checks"]
      },
      "RpcHealthResponse": {
        "type": "object",
        "properties": {
          "status": { "type": "string", "enum": ["ok", "degraded"] },
          "version": { "type": "string" },
          "timestamp": { "type": "string", "format": "date-time" },
          "network": { "type": "string" },
          "checks": { "$ref": "#/components/schemas/Checks" }
        },
        "required": ["status", "version", "timestamp", "checks", "network"]
      }
    }
  }
